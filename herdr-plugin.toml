id = "shadowfax.ferry"
name = "Herdr Ferry"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Move live panes and tabs or merge workspaces from a native popup."
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open"
title = "Open Ferry"
description = "Move panes or tabs, or merge one workspace into another."
contexts = ["pane"]
command = ["./target/release/herdr-ferry", "open"]

[[actions]]
id = "install-keybindings"
title = "Install Ferry keybinding"
description = "Bind prefix+m to open Ferry."
command = ["./target/release/herdr-ferry", "install-keybindings"]

[[panes]]
id = "picker"
title = "Ferry"
placement = "popup"
width = 76
height = 24
command = ["./target/release/herdr-ferry", "picker"]

# Server-owned executor consumes only private, confirmed, session-scoped jobs.
[[actions]]
id = "execute-close"
title = "Execute confirmed Ferry closures"
description = "Internal worker; without a confirmed request this does nothing."
command = ["./target/release/herdr-ferry", "close-worker"]

[[actions]]
id = "open-close"
title = "Close / Clear…"
description = "Select, review and explicitly confirm closing panes, tabs or workspaces, or clearing a workspace."
contexts = ["pane"]
command = ["./target/release/herdr-ferry", "open-close"]

[[actions]]
id = "clear-ft"
title = "Clear ft…"
description = "Review and clear one ft workspace in the current session, keeping a fresh shell."
contexts = ["pane"]
command = ["./target/release/herdr-ferry", "clear-ft"]

[[panes]]
id = "close-picker"
title = "Ferry Close / Clear"
placement = "popup"
width = 90
height = 28
command = ["./target/release/herdr-ferry", "close-picker"]
